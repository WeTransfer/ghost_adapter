Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Layout/LineLength:
  Exclude:
    - spec/**/*_spec.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb

Metrics/ClassLength:
  CountAsOne:
    - 'array'
    - 'hash'
    - 'heredoc'
  Max: 150

Metrics/MethodLength:
  Max: 15
  CountAsOne:
    - 'array'
    - 'hash'
    - 'heredoc'
  AllowedMethods:
    - build_ghost_command

Metrics/ModuleLength:
  CountAsOne:
    - 'array'
    - 'hash'
    - 'heredoc'
  Exclude:
    - lib/ghost_adapter/config.rb

Metrics/AbcSize:
  AllowedMethods:
    - build_ghost_command

AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  NewCops: enable
